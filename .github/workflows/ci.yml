name: CI Testing
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24, 25]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install flvtool2
        run: sudo gem install flvtool2
      - name: Install ffmpeg
        run: sudo apt install -y ffmpeg

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Generate coverage report
        run: pnpm coverage
      - name: Store coveralls coverage
        uses: coverallsapp/github-action@v2
        with:
          flag-name: linux-node-${{ matrix.node }}
          parallel: true
      - name: Upload to codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage/lcov.info
          name: ubuntu-latest-node-${{ matrix.node }}

  upload-coverage:
    name: Upload coverage
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload to coveralls
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "linux-node-18,linux-node-20,linux-node-22,linux-node-24,linux-node-25"
