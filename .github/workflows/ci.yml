name: CI Testing
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 18
            pnpm: 10.34.4
          - node: 20
            pnpm: 10.34.4
          - node: 22
            pnpm: 11.9.0
          - node: 24
            pnpm: 11.9.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install flvtool2
        run: sudo gem install flvtool2
      - name: Install ffmpeg
        run: sudo apt install -y ffmpeg

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: corepack pnpm@${{ matrix.pnpm }} install --frozen-lockfile
      - name: Show runtime versions
        run: |
          node --version
          corepack pnpm@${{ matrix.pnpm }} --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run tests
        run: npm test
      - name: Run functional end-to-end tests
        run: npm run test:e2e:functional
      - name: Run packed package consumer test
        if: matrix.node == 18 || matrix.node == 24
        run: npm run test:e2e:package
      - name: Generate coverage report
        run: npm run coverage
      - name: Store coveralls coverage
        uses: coverallsapp/github-action@v2
        with:
          flag-name: linux-node-${{ matrix.node }}
          parallel: true
      - name: Upload to codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage/lcov.info
          name: ubuntu-latest-node-${{ matrix.node }}

  upload-coverage:
    name: Upload coverage
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload to coveralls
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "linux-node-18,linux-node-20,linux-node-22,linux-node-24"
